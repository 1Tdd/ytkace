name: Deb

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Test
        run: python3 -m unittest discover -s Tests -v
      - name: Hook runtime test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgnustep-base-dev clang
          bash Tests/run_hooking_test.sh

  media:
    needs: test
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/.theos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1
          fail-on-cache-miss: true
      - uses: actions/cache@v4
        id: media
        with:
          path: Vendor/FFmpeg
          key: media-ios-arm64-${{ hashFiles('Scripts/build-ffmpeg.sh') }}
      - name: Build media libraries
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm pkg-config
          if ! bash Scripts/build-ffmpeg.sh; then
            find .build/ffmpeg -path '*/ffbuild/config.log' -exec tail -n 160 {} \;
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: media-libraries
          path: Vendor/FFmpeg
          if-no-files-found: error

  build:
    needs: [test, media]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            suffix: rootless
          - scheme: roothide
            suffix: roothide
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: media-libraries
          path: Vendor/FFmpeg

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1

      - name: Setup
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          set -o pipefail
          mkdir -p Resources/YTKACE.bundle/Licenses
          cp Vendor/FFmpeg/COPYING* THIRD_PARTY_NOTICES.md Resources/YTKACE.bundle/Licenses/
          make clean
          if ! make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1 2>&1 | tee /tmp/build.log; then
            echo "### Build Error (${{ matrix.scheme }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Name package
        id: name
        run: |
          deb="$(ls packages/*.deb | head -1)"
          version="$(awk '/^Version:/ {print $2}' control)"
          output="com.itzzace.ytkace_${version}_${{ matrix.suffix }}.deb"
          mkdir -p artifacts
          cp "$deb" "artifacts/$output"
          echo "deb=artifacts/$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.name.outputs.deb }}
          archive: false
          if-no-files-found: error
