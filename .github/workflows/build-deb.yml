name: Deb

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: python3 -m unittest discover -s Tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            suffix: rootless
          - scheme: roothide
            suffix: roothide
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - uses: actions/checkout@v6

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1

      - name: Setup
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          make clean
          if ! make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1 2>&1 | tee /tmp/build.log; then
            echo "### Build Error (${{ matrix.scheme }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Name package
        id: name
        run: |
          deb="$(ls packages/*.deb | head -1)"
          version="$(awk '/^Version:/ {print $2}' control)"
          output="com.itzzace.ytkace_${version}_${{ matrix.suffix }}.deb"
          mkdir -p artifacts
          cp "$deb" "artifacts/$output"
          echo "deb=artifacts/$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.name.outputs.deb }}
          archive: false
          if-no-files-found: error
